<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Kasir Om Jabrik</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    .app {
      max-width: 600px;
      min-height: 100vh;
      margin: auto;
      background: white;
    }

    .header {
      padding: 20px;
      background: #222;
      color: white;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .content {
      padding: 20px;
    }

    .scan-button {
      width: 100%;
      padding: 18px;
      border: 0;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #eee;
      text-align: center;
    }

    .scanner {
      display: none;
      margin-top: 20px;
    }

    .scanner.active {
      display: block;
    }

    #reader {
      width: 100%;
    }

    .result {
      margin-top: 15px;
      padding: 15px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .close-button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #555;
      color: white;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>KASIR OM JABRIK</h1>
  </div>

  <div class="content">

    <button class="scan-button"
            onclick="startScanner()">
      📷 SCAN BARCODE
    </button>

    <div id="status"
         class="status">
      Scanner siap digunakan.
    </div>

    <div id="scanner"
         class="scanner">

      <div id="reader"></div>

      <div id="result"
           class="result">
        Arahkan kamera ke barcode
      </div>

      <button class="close-button"
              onclick="stopScanner()">
        TUTUP KAMERA
      </button>

    </div>

  </div>

</div>


<script>

let scanner = null;
let scannerRunning = false;
let scanLocked = false;
const API_URL =
  'https://script.google.com/macros/s/AKfycbyIJ3H6BV26AhvtllT1P-7sYXADInO5zPY8rTnRhUtGEecyWD9y_AGbVh57HKIto1fVtQ/exec';

/* ==============================
   MULAI SCANNER
   ============================== */

function startScanner() {

  if (scannerRunning) {
    return;
  }

  document
    .getElementById('scanner')
    .classList.add('active');

  document
    .getElementById('status')
    .textContent =
      'Meminta akses kamera...';

  document
    .getElementById('result')
    .textContent =
      'Arahkan kamera ke barcode';

  scanLocked = false;

  scanner = new Html5Qrcode('reader');

  const config = {
    fps: 10,

    qrbox: function(width, height) {

      const size =
        Math.floor(
          Math.min(width, height) * 0.7
        );

      return {
        width: size,
        height: size
      };
    }
  };


  scanner
    .start(

      {
        facingMode: {
          exact: "environment"
        }
      },

      config,

      function(decodedText) {

  if (scanLocked) {
    return;
  }

  scanLocked = true;

  document
    .getElementById('result')
    .textContent =
      'Barcode: ' + decodedText;

  document
    .getElementById('status')
    .textContent =
      'Mencari produk...';

  lookupProduct(decodedText);

}

      function(errorMessage) {

        // Abaikan error scan sementara.

      }

    )

    .then(function() {

      scannerRunning = true;

      document
        .getElementById('status')
        .textContent =
          'Kamera aktif.';

    })

    .catch(function(error) {

      console.error(error);

      document
        .getElementById('status')
        .textContent =
          'Kamera tidak dapat dibuka: ' +
          error;

    });
}

function lookupProduct(barcode) {

  const url =
    API_URL +
    '?api=product' +
    '&code=' +
    encodeURIComponent(barcode) +
    '&callback=productCallback';


  const oldScript =
    document.getElementById('productApiScript');

  if (oldScript) {
    oldScript.remove();
  }


  const script =
    document.createElement('script');

  script.id =
    'productApiScript';

  script.src = url;


  script.onerror = function() {

    document
      .getElementById('status')
      .textContent =
        'Gagal menghubungi server produk.';

    scanLocked = false;
  };


  document.body.appendChild(script);
}
  
/* ==============================
   HENTIKAN SCANNER
   ============================== */

function stopScanner() {

  if (!scanner || !scannerRunning) {

    document
      .getElementById('scanner')
      .classList.remove('active');

    return;
  }


  scanner
    .stop()

    .then(function() {

      scanner.clear();

      scanner = null;
      scannerRunning = false;

      document
        .getElementById('scanner')
        .classList.remove('active');

      document
        .getElementById('status')
        .textContent =
          'Scanner siap digunakan.';

    })

    .catch(function(error) {

      console.error(error);

      scanner = null;
      scannerRunning = false;

      document
        .getElementById('scanner')
        .classList.remove('active');

    });
}

  function productCallback(response) {

  if (!response || !response.success) {

    document
      .getElementById('status')
      .textContent =
        response && response.message
          ? response.message
          : 'Produk tidak ditemukan.';

    document
      .getElementById('result')
      .textContent =
        'Barcode: ' +
        (response && response.code
          ? response.code
          : '');

    scanLocked = false;

    return;
  }


  const product =
    response.product;


  document
    .getElementById('result')
    .innerHTML =
      '<strong>' +
      escapeHtml(product.name) +
      '</strong><br>' +
      escapeHtml(product.supplier) +
      '<br><br>' +
      formatRupiah(product.price);


  document
    .getElementById('status')
    .textContent =
      'Produk ditemukan.';


  /*
   * Untuk tahap ini belum masuk keranjang.
   *
   * Kita hanya membuktikan:
   *
   * SCAN → API → PRODUK → tampil.
   */
}

  function formatRupiah(value) {

  return 'Rp' +
    Number(value || 0)
      .toLocaleString('id-ID');

}


function escapeHtml(value) {

  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}

</script>

</body>
</html>
